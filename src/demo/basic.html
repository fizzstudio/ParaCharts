<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>Live Server Headless demo -- ParaCharts</title>

	<h1>@fizz/paracharts Basic Demo</h1>
  	<main>
    	<section id="content-container">
			<para-chart

				manifest="/src/demo-data/pokemon-multi-facet-manifest.json"
			></para-chart>
		</section>
  	</main>

</html>

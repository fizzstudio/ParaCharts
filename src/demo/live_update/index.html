<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>Single Series Live Update Demo -- ParaCharts</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22green%22/><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
	<style>
		:root {
			--paracharts-theme-color: hsl(194, 28%, 45%);
    		--paracharts-theme-color-light: hsl(194, 28%, 85%);
		}
		main {
			display: grid;
			grid-template-columns: 1fr 1fr;
			column-gap: 1rem;
		}
		#chart {
			--para-stroke-width: 20;
			/*width: 600px;*/
			width: 50vw;
		}
		#buttons {
			padding: 0.5rem;
		}
		body {
			font-family: 'Helvetica Neue', Arial, sans-serif;
			color: #333;
			font-weight: 300;
		}
		h1 {
			position: fixed;
			bottom: 0;
			right: 0;
			margin: 1rem;
			font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
			font-style: italic;
			font-weight: normal;
			color: hsl(0, 0%, 40%);
		}
		#text {
			background: lightskyblue;
			font-size: 20pt;
			padding: 1rem;
			margin: 20rem 0;
		}
		label {
			font-size: 12pt;
		}
	</style>
</head>
<body>
  	<script type="module" src="/src/demo/live_update/demo.ts"></script>
	<h1>@fizz/ParaCharts Single Series Live Update Demo</h1>
  	<main>
    	<section id="content-container">
			<para-chart
				id="chart"
				manifest="/src/demo/live_update/line-single-manifest-1047.json"
			></para-chart>
		</section>
		<section id="text">
			<div id="buttons">
				<button id="add-btn">Add Record</button>
				<button id="start-btn">Start/Stop Auto-update</button>
				<button id="reset-btn">Reset</button>
				<label>Delay (ms):
					<input type="number" size="6" id="delay-input">
				</label>
			</div>
			<textarea id="manifest" rows="10" cols="70" readonly></textarea>
		</section>
  	</main>
</body>
</html>
